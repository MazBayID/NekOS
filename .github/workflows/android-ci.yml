name: Android CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nekos-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      # The Termux AAPT2 override is device-specific and must not be used on GitHub-hosted Linux.
      - name: Remove local Termux AAPT2 override
        run: sed -i '/^android\.aapt2FromMavenOverride=/d' gradle.properties

      - name: Build debug APK and run checks
        run: |
          gradle --no-daemon assembleDebug testDebugUnitTest lintDebug \\
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \\
            --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: nekos-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: nekos-build-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
