name: Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/ci-trigger-once'

permissions:
  contents: read

concurrency:
  group: nekos-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, static checks, and Compose UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Validate repository JSON files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path(".").rglob("*.json"))
          for path in files:
              if ".git" in path.parts or "build" in path.parts or ".gradle" in path.parts:
                  continue
              with path.open(encoding="utf-8") as source:
                  json.load(source)
              print(f"Valid JSON: {path}")
          print(f"Validated {len(files)} JSON files.")
          PY

      - name: Set up Python for skin validation
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install skin validator dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Validate bundled default skin
        run: python3 -I nekos_skin_kit/tools/validate_skin.py nekos_skin_kit/default_skin --strict

      - name: Test stable skin glyph identities
        run: python3 -m unittest discover -s nekos_skin_kit/tests -p 'test_*.py' -v

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build Debug and Release APKs, run unit tests, and lint
        run: gradle assembleDebug assembleRelease testDebugUnitTest lintDebug -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" --stacktrace

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Compose UI tests on Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle connectedDebugAndroidTest -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: nekos-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: nekos-release-apk-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: nekos-test-reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7
