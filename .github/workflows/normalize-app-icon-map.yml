name: Normalize app icon catalog

on:
  push:
    branches:
      - fix/app-icon-catalog-v2
    paths:
      - ".github/workflows/normalize-app-icon-map.yml"
      - "main_assets/icon_pack-v2/tools/normalize_app_icon_map.py"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Normalize catalog
        run: python3 main_assets/icon_pack-v2/tools/normalize_app_icon_map.py

      - name: Validate normalized catalog
        run: python3 main_assets/icon_pack-v2/tools/normalize_app_icon_map.py --check

      - name: Commit normalized catalog
        run: |
          if git diff --quiet -- main_assets/icon_pack-v2/app_icon_map.json; then
            echo "Catalog already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main_assets/icon_pack-v2/app_icon_map.json
          git commit -m "Normalize app icon catalog schema v2"
          git push
