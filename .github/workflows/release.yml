name: NekOS Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nekos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build internal release candidate APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build unsigned release candidate, run unit tests, and lint
        run: gradle assembleRelease testDebugUnitTest lintDebug -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" --stacktrace

      - name: Upload internal release candidate APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: nekos-release-candidate-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: nekos-release-candidate-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
